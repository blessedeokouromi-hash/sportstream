
name: Update SportStream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract admin update
        run: |
          ZIP="sportstream-admin-update.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Update ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/sportstream-update
          unzip -o "$ZIP" -d /tmp/sportstream-update

          PROJECT_DIR=$(find /tmp/sportstream-update -name package.json -type f | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "Project files not found!"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .
          rm -f "$ZIP"

      - name: Commit updated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Add SportStream admin dashboard"
            git push
          fi
          
